# nginx.conf -- full replacement of the nginxinc/nginx-unprivileged default config.
#
# Serves the static Angular "conduit" bundle with:
#   - a real SPA fallback (try_files) so deep links don't 404 -- the app's own
#     `_redirects` file is a Netlify rewrite rule and does nothing under nginx (F7)
#   - cache headers that differ between index.html (must always revalidate, since
#     it references the current content-hashed asset filenames) and the hashed
#     JS/CSS assets themselves (safe to cache forever, since a content change means
#     a new filename)
#   - a disk-free /healthz endpoint
#   - gzip compression
#   - security headers, including a CSP scoped to what this app actually loads
#     (see the CSP comment below for the reasoning behind every allowed origin)
#
# pid is redirected to /tmp because /run is root-owned in this image and the
# master process runs as uid 101 (nginx), not root -- matches the base image's
# own default nginx.conf, which this file otherwise fully replaces.
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Downgrades the Server response header from "nginx/<version>" to just "nginx".
    # Stock nginx (no third-party headers-more module compiled in, which this base
    # image does not have) cannot suppress the Server header entirely -- this is
    # the closest available control, and it removes the version-fingerprinting risk.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # Cache-Control varies by URI rather than by location block. nginx's add_header
    # does NOT merge with a parent context once a child location defines its own
    # add_header -- it replaces the whole set -- so driving Cache-Control from a
    # map and adding it exactly once at the server level (below) keeps every
    # response carrying the same security headers without having to repeat them
    # in every location block.
    map $uri $cache_control {
        # Angular's "application" builder content-hashes every JS/CSS filename
        # (e.g. main-TNZ7TRFT.js, styles-V7LOWGDA.css), so a changed file always
        # ships under a new URL -- safe to cache for a year and mark immutable.
        default                      "public, max-age=3600";
        "~*\.(?:js|css)$"            "public, max-age=31536000, immutable";
        /index.html                  "no-cache";
        /healthz                     "no-store";
    }

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;

        # Standard defense-in-depth headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Content-Security-Policy -- scoped to exactly what this build's index.html
        # loads (verified by reading the built output, not guessed):
        #   script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='
        #                                   -- every <script> is a same-origin hashed
        #                                      bundle (main-*.js) loaded via <script
        #                                      src>, so no blanket 'unsafe-inline'/
        #                                      'unsafe-eval' is needed (the app is
        #                                      also built zoneless -- angular.json
        #                                      polyfills: [] -- so there's no zone.js
        #                                      monkey-patching wanting 'unsafe-eval'
        #                                      either). The one hash allowlisted here
        #                                      is NOT a compromise made for this
        #                                      change: it was discovered empirically
        #                                      by loading the built app in a real
        #                                      browser and reading the console --
        #                                      Angular's own build (optimization ->
        #                                      inlineCriticalCss, via `beasties`)
        #                                      emits a loadCSS-pattern deferred
        #                                      stylesheet in index.html:
        #                                        <link rel="stylesheet"
        #                                          href="styles-*.css" media="print"
        #                                          onload="this.media='all'">
        #                                      That inline onload handler is what
        #                                      flips the app's main stylesheet from
        #                                      print-only to screen-visible; with a
        #                                      bare script-src 'self' the browser
        #                                      blocks it (event handlers are
        #                                      governed by script-src, not
        #                                      style-src), silently leaving the
        #                                      entire app unstyled. Confirmed both
        #                                      ways in a live container: with the
        #                                      hash omitted, the console showed a
        #                                      CSP violation for the inline handler
        #                                      and the link's `media` stayed stuck
        #                                      at "print"; with the hash present,
        #                                      the handler runs and `media` becomes
        #                                      "all". 'unsafe-hashes' plus an exact
        #                                      content hash allowlists only that one
        #                                      literal handler string (which comes
        #                                      from Angular's own build output, not
        #                                      user input) -- it does not open the
        #                                      door to arbitrary inline handlers, so
        #                                      it doesn't weaken the XSS posture
        #                                      that script-src 'self' is there to
        #                                      protect (see the JWT/localStorage
        #                                      note below). Editing angular.json to
        #                                      disable inlineCriticalCss would avoid
        #                                      needing this hash at all, but that
        #                                      file is out of scope for this step
        #                                      (Dockerfile/.dockerignore/nginx.conf
        #                                      only).
        #   style-src ... 'unsafe-inline'
        #     code.ionicframework.com
        #                                   -- the build inlines two <style> blocks
        #                                      directly into <head> (critical CSS +
        #                                      @font-face rules from Angular's font
        #                                      inlining); there's no per-request
        #                                      templating layer to hand out a nonce
        #                                      to a static nginx image, so
        #                                      'unsafe-inline' is the pragmatic
        #                                      choice here. code.ionicframework.com
        #                                      is allowed because index.html links
        #                                      its ionicons stylesheet from there --
        #                                      as a protocol-relative URL
        #                                      (href="//code.ionicframework.com/...").
        #                                      Deliberately listed WITHOUT an
        #                                      https:// scheme prefix: a schemeless
        #                                      CSP host-source matches whatever
        #                                      scheme the page itself was loaded
        #                                      under (per spec). This container is
        #                                      plain HTTP on its own (TLS is a later
        #                                      infra concern, terminated in front of
        #                                      it), so a hardcoded `https://` prefix
        #                                      here would mismatch the browser's
        #                                      http:// resolution of the
        #                                      protocol-relative link and silently
        #                                      block the stylesheet -- confirmed
        #                                      empirically (console: "Loading the
        #                                      stylesheet 'http://
        #                                      code.ionicframework.com/...' violates
        #                                      ... style-src"). The schemeless form
        #                                      works correctly whether this is
        #                                      served over http (as tested here) or
        #                                      https (once fronted by TLS later).
        #   font-src ... https://fonts.gstatic.com code.ionicframework.com
        #                                   -- the inlined @font-face rules use a
        #                                      hardcoded https:// URL for
        #                                      fonts.gstatic.com (not
        #                                      protocol-relative), so that one is
        #                                      safe to pin to https. The ionicons
        #                                      stylesheet serves its own icon font
        #                                      from its own origin as a
        #                                      protocol-relative URL too, so it
        #                                      gets the same schemeless treatment
        #                                      as above.
        #   img-src 'self' data: https:    -- article bodies are user-submitted
        #                                      markdown (rendered client-side via
        #                                      `marked`, see F15) that can
        #                                      legitimately embed images hosted
        #                                      anywhere; restricting img-src to
        #                                      'self' would break normal use of the
        #                                      app. This is the one deliberately
        #                                      "loose" rule, and it's img-only --
        #                                      it cannot be used to run script.
        #   connect-src 'self'              -- the app calls the API via a relative
        #                                      /api path (same-origin), no external
        #                                      API host is configured (see
        #                                      user.service.ts, articles.service.ts).
        #   object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action
        #     'self'                        -- standard hardening: no plugins, no
        #                                      <base> hijacking, no framing, no
        #                                      cross-origin form submission.
        #
        # Note on `marked` + XSS (F15/F16 -- JWT lives in localStorage, so an XSS
        # here is a full account takeover): the CSP above is defense-in-depth, not
        # the primary control. The primary control is that
        # src/app/shared/pipes/markdown.pipe.ts runs marked's output through
        # Angular's DomSanitizer (SecurityContext.HTML) before binding it via
        # [innerHTML] -- Angular's sanitizer strips <script>, inline event
        # handlers, and javascript: URLs regardless of CSP. script-src 'self' with
        # no 'unsafe-inline' means even a sanitizer bypass could not execute an
        # attacker-injected <script> tag or inline handler.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' code.ionicframework.com; font-src 'self' https://fonts.gstatic.com code.ionicframework.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

        # Health check: must not touch disk, so this returns a static string
        # directly instead of resolving to a file under root.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # SPA fallback: any path that isn't a real file (e.g. /article/some-slug)
        # falls back to index.html so Angular's router can take over client-side.
        # This is what actually fixes F7 -- the repo's `_redirects` file is a
        # Netlify-only rewrite rule and is never read by nginx.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}

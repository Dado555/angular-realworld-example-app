name: Playwright Tests

# step 8.2 decision checkpoint: E2E is slow (60min timeout), so this runs
# nightly plus on-demand rather than on every push/PR - ci.yml's own
# format/typecheck/unit-test/build/trivy gates already cover every PR.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Install Playwright Browsers
      run: bunx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: bun run test:e2e
      env:
        CI: true

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results
        path: test-results/
        retention-days: 30
